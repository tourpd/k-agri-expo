  </defs>

  <!-- 그림자 -->
  <ellipse cx="120" cy="246" rx="70" ry="9" fill="#0f172a" opacity=".08"/>

  <!-- 몸통: 흰 가운 -->
  <path d="M52 250 C52 196 70 168 92 160 L120 176 L148 160 C170 168 188 196 188 250 Z" fill="url(#coat)" stroke="#cbd5e1" stroke-width="3"/>
  <!-- 가운 안쪽 초록 셔츠 -->
  <path d="M100 162 L120 176 L140 162 L140 250 L100 250 Z" fill="#16a34a"/>
  <!-- 옷깃 -->
  <path d="M92 160 L120 176 L104 204 L86 170 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round"/>
