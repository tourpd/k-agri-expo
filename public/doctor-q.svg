  <circle cx="99" cy="108" r="4.5" fill="#0f172a"/>
  <circle cx="143" cy="108" r="4.5" fill="#0f172a"/>
  <circle cx="101" cy="106" r="1.5" fill="#fff"/>
  <circle cx="145" cy="106" r="1.5" fill="#fff"/>
  <!-- 눈썹 -->
  <path d="M86 90 C92 86 102 86 108 88" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 88 C138 86 148 86 154 90" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <!-- 볼 -->
  <ellipse cx="86" cy="126" rx="8" ry="5" fill="#fca5a5" opacity=".6"/>
  <ellipse cx="154" cy="126" rx="8" ry="5" fill="#fca5a5" opacity=".6"/>
  <!-- 코·입 -->
  <path d="M120 116 C118 122 118 126 122 128" fill="none" stroke="#d1a07a" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 136 C112 146 128 146 136 136" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>

  <!-- 손: 엄지 척 -->
  <g transform="translate(176 190)">
    <path d="M0 26 C0 14 6 8 14 8 L14 -6 C14 -14 26 -14 26 -6 L26 8 L34 8 C40 8 42 14 40 20 L34 40 C32 46 28 48 22 48 L8 48 C2 48 0 44 0 38 Z" fill="url(#skin)" stroke="#e2b48f" stroke-width="2"/>
