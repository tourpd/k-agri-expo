  <text x="161" y="212" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="900" fill="#15803d" text-anchor="middle">Q</text>
  <!-- 주머니 속 펜 -->
  <rect x="66" y="198" width="22" height="18" rx="3" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="73" y="188" width="4" height="16" rx="2" fill="#16a34a"/>

