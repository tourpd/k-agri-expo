  <path d="M128 190 C128 180 134 180 134 190" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <path d="M104 212 C96 222 98 236 110 238 C118 239 124 232 122 224 C112 222 106 218 104 212 Z" fill="#16a34a" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>

