  <circle cx="98" cy="106" r="16" fill="#ffffff" fill-opacity=".55" stroke="#0f172a" stroke-width="4"/>
  <circle cx="142" cy="106" r="16" fill="#ffffff" fill-opacity=".55" stroke="#0f172a" stroke-width="4"/>
