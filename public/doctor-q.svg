  <!-- 얼굴 -->
  <ellipse cx="120" cy="104" rx="54" ry="56" fill="url(#skin)" stroke="#e2b48f" stroke-width="2"/>
  <!-- 귀 -->
  <ellipse cx="66" cy="108" rx="9" ry="12" fill="#f6c9a3" stroke="#e2b48f" stroke-width="2"/>
  <ellipse cx="174" cy="108" rx="9" ry="12" fill="#f6c9a3" stroke="#e2b48f" stroke-width="2"/>
  <!-- 머리카락 -->
  <path d="M66 96 C66 56 92 44 120 44 C148 44 174 56 174 96 C166 78 150 70 120 70 C90 70 74 78 66 96 Z" fill="#1f2937"/>
  <path d="M84 76 C92 66 104 62 120 62" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
